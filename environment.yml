name: stac-airphoto-bc
channels:
  # conda-forge only. The `defaults` channel points at repo.anaconda.com, whose
  # Terms of Service must be accepted interactively before an env will build —
  # `conda env create` fails with CondaToSNonInteractiveError otherwise. Nothing
  # here needs it: python and pip come from conda-forge, everything else is pip.
  - conda-forge
dependencies:
  - python>=3.9
  - pip
  - pip:
      - pystac>=1.12.0
      - rio-stac>=0.11.0
      - rasterio>=1.4.0
      - shapely
      - pyarrow
      - tqdm
      - jsonschema
